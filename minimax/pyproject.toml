[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sddctx"
version = "1.0.0"
description = "Spec-driven development context toolkit (specs + code + tests + task state)"
requires-python = ">=3.12,<4.0"
dependencies = [
  "powercontext[builtin]==1.4.1",
  "pymysql>=1.1,<3.0",
  "requests>=2.31,<3.0",
]

[project.optional-dependencies]
demo = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pytest>=8.0,<10.0",
  "httpx>=0.27,<1.0",
]
seekdb-embedded = ["pylibseekdb>=1.4.0.post1,<1.5"]
lint = ["ruff>=0.6,<1.0"]

[tool.setuptools]
packages = ["sddctx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".data", ".venv", "evidence", "records"]

[tool.ruff.lint]
# Correctness-oriented rule set for V1 (style churn is deliberately excluded).
select = [
  "F",   # pyflakes: undefined names, unused imports/variables
  "E9",  # syntax/runtime errors
  "B",   # bugbear: real bug patterns
  "PLE", # pylint errors
  "RUF", # ruff-specific correctness checks
  "I",   # import sorting
  "PLW", # pylint warnings (e.g. subprocess check)
]
# The project is bilingual: full-width punctuation in Chinese strings is intended.
ignore = [
  "RUF001", "RUF002", "RUF003",  # full-width punctuation in Chinese strings
  "PLW0108",                     # explicit lambdas are kept for closure readability
  "PLW0603",                     # module-level caches guarded by a lock (pcstore)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811", "RUF012"]
"demo/tests/*" = ["F401", "F811"]
