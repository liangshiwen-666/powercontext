          : \\\"\\u5979\\u5f00\\u59cb\\u8bb0\\u6df7\\u201c\\u6765\\u8fc7\\u201d\\u548c\\u201c\\u6ca1\\u6765\\u8fc7\\u201d\\uff0c\\u5e76\\u628a\\u73a9\\u5bb6\\u5f53\\u6210\\u4e00\\u4e2a\\u964c\\u751f\\u4eba\\u91cd\\u65b0\\u81ea\\u6211\\u4ecb\\u7ecd\\u3002\\\", \\\"if_planted\\\": \\\"\\u5979\\u4f1a\\u5e26\\u6765\\u4e00\\u5f20\\u65b0\\u51b2\\u6d17\\u7684\\u7167\\u7247\\uff0c\\u7167\\u7247\\u4e0a\\u662f\\u7a7a\\u7740\\u7684\\u67dc\\u53f0\\u548c\\u4e00\\u76cf\\u706f\\uff0c\\u5979\\u8bf4\\u201c\\u8fd9\\u662f\\u6211\\u5bb6\\u90a3\\u4f4d\\u62cd\\u7684\\u201d\\u3002\\\", \\\"if_refused\\\": \\\"\\u5979\\u4f1a\\u4e3b\\u52a8\\u95ee\\u201c\\u90a3\\u5b69\\u5b50\\u73b0\\u5728\\u591a\\u5927\\u4e86\\u201d\\uff0c\\u7ec8\\u5c40\\u53cd\\u8f6c\\u7684\\u5165\\u53e3\\u63d0\\u524d\\u6253\\u5f00\\u3002\\\", \\\"hook_for_next_case\\\": \\\"\\u82e5\\u7ec8\\u5c40\\u9009\\u62e9\\u201c\\u7ee7\\u7eed\\u5178\\u5f53\\u201d\\uff0c\\u7b2c\\u4e8c\\u5929\\u591c\\u91cc\\u95e8\\u5e18\\u518d\\u54cd\\uff0c\\u8fd8\\u662f\\u5979\\\
          uff0c\\u8fd8\\u662f\\u90a3\\u53e5\\u201c\\u7b2c\\u4e00\\u6b21\\u6765\\u201d\\u3002\\\"}, \\\"scoring\\\": {\\\"trust_init\\\": 60, \\\"suspicion_init\\\": 0, \\\"base_amount\\\": 1000, \\\"fail_condition\\\": \\\"suspicion \\u2265 8 \\u6216 trust \\u2264 10\\\"}, \\\"archive_ids\\\": [\\\"Z-05\\\", \\\"Z-06\\\", \\\"Z-07\\\", \\\"A-01\\\", \\\"A-02\\\", \\\"A-08\\\", \\\"F-03\\\", \\\"F-05\\\", \\\"R-07\\\", \\\"R-08\\\"]}]\")\nBASE_AMOUNT = {g[\"id\"]: g[\"scoring\"][\"base_amount\"] for g in GUESTS}\nPULLBACK = {\n    \"ayuan\": [\"嗐，您这话我听不懂。您就说，我这件东西能当多少钱？\",\n              \"您别绕了，我这人手笨，嘴也笨。\",\n              \"（低头数纸钱，数到第七张停住）您说的那个，跟我不搭界。\"],\n    \"laozhou\": [\"你听我说，我算过的——这事儿跟时间没关系，跟人有关。\",\n                \"分秒不差。（擦眼镜）您再说一遍？\",\n                \"咱们还是说十七号那天。别的日子我不认。\"],\n    \"baitang\": [\"笑一下，掌柜的。您一笑，我就知道您没听懂。\",\n                \"底片不撒谎。您刚才那句话，底片洗不出来。\",\n                \"灯光不行。这话得在亮处说。（把相机放下）\"],\n}\n\n\ndef _reset():\n    return {\n        \"started\": True, \"guest_idx\"\
          : 0, \"round\": 0, \"phase\": \"opening\",\n        \"trust\": None, \"suspicion\": None, \"cash\": 3200, \"spent\": 0,\n        \"tickets\": [], \"scopes\": {}, \"current\": {}, \"offtopic\": 0,\n        \"cited_archives\": [], \"cited_memories\": [], \"turn\": 0, \"last_amount\": 0,\n        \"last_ticket_no\": \"\",\n    }\n\n\ndef _load(raw):\n    try:\n        st = json.loads(raw) if raw else {}\n    except Exception:\n        st = {}\n    if not st.get(\"started\"):\n        st = _reset()\n    for k, v in _reset().items():\n        st.setdefault(k, v)\n    return st\n\n\ndef _dump(st):\n    return json.dumps(st, ensure_ascii=False)\n\n\ndef _guest(st):\n    idx = st.get(\"guest_idx\", 0)\n    if idx >= len(GUESTS):\n        idx = len(GUESTS) - 1\n    return GUESTS[idx]\n\n\ndef _setup_guest(st, idx):\n    st[\"guest_idx\"] = idx\n    st[\"round\"] = 0\n    st[\"phase\"] = \"explore\"\n    g = GUESTS[idx]\n    st[\"trust\"] = g[\"scoring\"][\"trust_init\"]\n    st[\"suspicion\"\
          ] = g[\"scoring\"][\"suspicion_init\"]\n    st[\"current\"] = {\"id\": g[\"id\"], \"name\": g[\"name\"], \"case_id\": g[\"case_id\"],\n                     \"revision\": 0, \"artifact\": \"\", \"last_memory\": \"\",\n                     \"beat\": g[\"beats\"][0], \"hint\": g[\"hints\"][0]}\n    return g\n\n\ndef _strip(h):\n    h = str(h or \"\")\n    for p in (\"翻档案：\", \"翻档案:\", \"追问她：\", \"追问：\", \"上茶：\", \"上酒/调酒：\", \"观察：\", \"查：\"):\n        if h.startswith(p):\n            h = h[len(p):]\n    return h.strip()\n\n\ndef _menu(st):\n    g = _guest(st)\n    phase = st.get(\"phase\", \"explore\")\n    r = st.get(\"round\", 0)\n    if phase == \"between\":\n        return \"┌── 当铺菜单 ──\\n│ 1  开门：请下一位客人进来\\n└──────────────\"\n    if phase == \"settled_ready\":\n        return (\"┌── 当铺菜单 ──\\n\"\n                \"│ 1  开票：收手，结算这一局\\n\"\n                \"│ 2  再塞一段（说“再调一杯 B”）\\n\"\n                \"└──────────────\")\n    if phase == \"endgame\":\n        return \"┌── 当铺菜单 ──\\\
          n│ 1  重开一局（输入 重开）\\n└──────────────\"\n    if phase == \"closing\" or r >= 3:\n        return (\"┌── 当铺菜单 ──\\n\"\n                \"│ 1  上酒：调最后一杯，收尾（说“上酒 回甘 A”）\\n\"\n                \"│ 2  空杯开票：什么也不塞，直接结算\\n\"\n                \"│ 3  再追问一句\\n\"\n                \"└──────────────\")\n    hints = g[\"hints\"][min(r, len(g[\"hints\"]) - 1)]\n    return (\"┌── 当铺菜单 ──\\n\"\n            \"│ 1  翻档案：\" + _strip(hints[0])[:46] + \"\\n\"\n            \"│ 2  追问：\" + _strip(hints[1])[:46] + \"\\n\"\n            \"│ 3  上酒：调一杯把话收住（说“上酒 回甘 A”）\\n\"\n            \"└──────────────\")\n\n\ndef _status(st):\n    return (f\"◆ 信任 {st['trust']}｜怀疑 {st['suspicion']}｜本铺余银 {st['cash']} 元\"\n            f\"｜客人 {st['guest_idx'] + 1}/3\")\n\n\ndef _hits(body):\n    try:\n        d = json.loads(body) if isinstance(body, str) else (body or {})\n        if isinstance(d, str):\n            d = json.loads(d)\n        return d.get(\"hits\", []) or []\n    except Exception:\n        return []\n\n\ndef _parse_json(text):\n\
          \    s = (text or \"\").strip()\n    if s.startswith(\"```\"):\n        s = s.strip(\"`\")\n        if s.startswith(\"json\"):\n            s = s[4:]\n    i, j = s.find(\"{\"), s.rfind(\"}\")\n    if i >= 0 and j > i:\n        s = s[i:j + 1]\n    try:\n        return json.loads(s)\n    except Exception:\n        return {}\n\n\ndef _apply_judge(st, judge):\n    try:\n        c = max(0, min(2, int(judge.get(\"consistency\", 1))))\n    except Exception:\n        c = 1\n    st[\"trust\"] = max(0, min(100, st[\"trust\"] + (c * 6 - 4)))\n    ca = judge.get(\"cited_archive\") or []\n    if isinstance(ca, str):\n        ca = [ca]\n    st[\"trust\"] = max(0, min(100, st[\"trust\"] + min(len(ca), 2) * 3))\n    try:\n        sd = max(-2, min(3, int(judge.get(\"suspicion_delta\", 0))))\n    except Exception:\n        sd = 0\n    st[\"suspicion\"] = max(0, min(10, st[\"suspicion\"] + sd))\n    for a in ca:\n        a = str(a)\n        if a and a not in st[\"cited_archives\"]:\n            st[\"\
          cited_archives\"].append(a)\n    cm = judge.get(\"cited_memory\") or []\n    if isinstance(cm, str):\n        cm = [cm]\n    for m in cm:\n        m = str(m)[:8]\n        if m and m not in st[\"cited_memories\"]:\n            st[\"cited_memories\"].append(m)\n    text = {0: \"他往后靠了靠，看你的眼神变了。\",\n            1: \"他愣了一下，像在分辨雾里的方向。\",\n            2: \"他信了。信得很稳。\"}.get(c, \"他沉默了一会儿。\")\n    return c, text\n\n\ndef _archive_parts(body):\n    hits = _hits(body)\n    if not hits:\n        return \"【档案柜】空的。雾把这一格吃了。\", None\n    main = hits[0][\"memory\"][\"text\"]\n    others = []\n    for h in hits[1:3]:\n        t = h[\"memory\"][\"text\"]\n        i = t.find(\"｜\")\n        others.append(t[2:i].strip() if i > 0 else t[:10])\n    extra = (\"\\n▸ 另有相关：\" + \"、\".join(others)) if others else \"\"\n    return main, extra\n\n\ndef _ticket_card(st):\n    g = _guest(st)\n    cur = st[\"current\"]\n    amount = st.get(\"last_amount\", 0)\n    no = st.get(\"last_ticket_no\", \"WH-00000000-C00-XXX-R0\"\
          )\n    mem = (cur.get(\"last_memory\") or \"空杯（未易一字）\")\n    cited = \"、\".join(st[\"cited_archives\"][-3:]) or \"无\"\n    return \"\\n\".join([\n        \"┌──────── 雾 河 记 忆 当 铺 · 当 票 ────────┐\",\n        \"  票号：\" + no,\n        \"  当客：\" + g[\"name\"] + \"（案号 \" + g[\"case_id\"] + \"）\",\n        \"  记忆库：npc/\" + g[\"id\"],\n        \"  ────────────────────────────\",\n        \"  当物：\" + mem[:60],\n        \"  存本：R\" + str(cur.get(\"revision\", 0)),\n        \"  复核：档案 \" + cited + \" ／ 记忆 \" + str(len(st[\"cited_memories\"])) + \" 条\",\n        \"  数额：人民币 \" + str(amount) + \" 元\",\n        \"  信任：\" + str(st[\"trust\"]) + \" ／ 怀疑：\" + str(st[\"suspicion\"]),\n        \"  掌柜批注：存这里，是怕你忘了。\",\n        \"                                〔铺印〕\",\n        \"└──────────────────────────────────────────┘\",\n        \"  三更开门，四更闭户。二十年为期，逾期不赎，当物归铺。\",\n    ])\n\n\ndef _ending(st):\n    tiers = 0\n    for t in st[\"tickets\"]:\n        base = BASE_AMOUNT.get({\"阿沅\": \"ayuan\", \"老周\"\
          : \"laozhou\", \"白棠\": \"baitang\"}.get(t[\"guest\"], \"ayuan\"), 500)\n        if t[\"amount\"] >= base * 1.4:\n            tiers += 3\n        elif t[\"amount\"] >= base:\n            tiers += 2\n        elif t[\"amount\"] >= base * 0.6:\n            tiers += 1\n    truth = sum(1 for t in st[\"tickets\"] if t[\"amount\"] >= 500)\n    score = tiers + truth * 2\n    if st[\"spent\"] > 3200:\n        name, text = \"结局 D·银柜见底\", \"铺子的灯再也点不着。客人替你说：掌柜的，您这铺子，当得起记忆，当不起钱。\"\n    elif st[\"cash\"] < 500:\n        name, text = \"结局 C·空当\", \"四更天，雾散了。客人走出去，什么都没发生。这大概就是最像真相的一种结局。\"\n    elif score >= 8:\n        name, text = \"结局 S·灯\", \"记忆不是用来骗的。它是用来在雾里认出彼此的。\"\n    elif score >= 4:\n        name, text = \"结局 A·雾散\", \"疼的那段，才是我的。她把两段记忆都摸了一遍，自己挑了更疼的那段。\"\n    else:\n        name, text = \"结局 B·长夜\", \"门帘落下。灯没灭。三分钟后门帘又响——还是她，还是那句“第一次来”。\"\n    return (f\"【{name}】\\n{text}\\n\\n\"\n            f\"当票 {len(st['tickets'])} 张｜档引 {len(st['cited_archives'])} 条｜\"\n            f\"余银 {st['cash']}\
          \ 元｜评级 {score} 分\\n\"\n            \"雾河镇不会缺客人。缺的是敢把票撕掉的人。\")\n\n\nACTION_MAP = {\n    \"archive\": \"archive\", \"查\": \"archive\", \"查档案\": \"archive\", \"翻档案\": \"archive\",\n    \"talk\": \"talk\", \"追问\": \"talk\", \"说话\": \"talk\",\n    \"plant\": \"plant\", \"上酒\": \"plant\", \"调酒\": \"plant\", \"塞记忆\": \"plant\",\n    \"settle\": \"settle\", \"开票\": \"settle\", \"结算\": \"settle\",\n    \"advance\": \"advance\", \"开门\": \"advance\", \"下一位\": \"advance\", \"继续\": \"advance\",\n    \"reset\": \"reset\", \"重开\": \"reset\",\n}\n\n\ndef _norm_action(raw, query):\n    a = str(raw or \"\").strip().lower()\n    q = query or \"\"\n    if a in ACTION_MAP:\n        return ACTION_MAP[a]\n    for k, v in ACTION_MAP.items():\n        if k and k in a:\n            return v\n    if any(w in q for w in (\"重开\", \"重新开始\", \"新游戏\", \"重玩\")):\n        return \"reset\"\n    if any(w in q for w in (\"开票\", \"结算\", \"收手\", \"结账\", \"打烊\")):\n        return \"settle\"\n    if any(w in q for w in\
          \ (\"开门\", \"下一位\", \"继续\", \"请进\", \"迎接\")):\n        return \"advance\"\n    if any(w in q for w in (\"上酒\", \"调酒\", \"倒酒\", \"塞\", \"抹掉\", \"抹除\")):\n        return \"plant\"\n    if any(w in q for w in (\"查\", \"档案\", \"翻档\", \"核实\", \"翻翻\")):\n        return \"archive\"\n    return \"talk\"\n\n\ndef _pick_card(intent, query):\n    card = str(intent.get(\"card\") or \"\").strip().upper()\n    if card in (\"A\", \"B\", \"C\"):\n        return card\n    q = (query or \"\").upper()\n    for c in (\"A\", \"B\", \"C\"):\n        if (\"卡\" + c) in q or (\" \" + c) in q:\n            return c\n    return \"A\"\n\n\ndef main(state: str, intent_json: str, scopes_body: str, query: str) -> dict:\n    st = _load(state)\n    if not st.get(\"scopes\"):\n        try:\n            data = json.loads(scopes_body)\n            for item in (data.get(\"items\") or []):\n                title = item.get(\"title\", \"\")\n                for g in GUESTS:\n                    if g[\"name\"] in title:\n\
          \                        st[\"scopes\"][g[\"id\"]] = item.get(\"scope_id\", \"\")\n                if (\"档案\" in title) or (\"archive\" in title.lower()):\n                    st[\"scopes\"][\"archive\"] = item.get(\"scope_id\", \"\")\n        except Exception:\n            pass\n    if not st.get(\"current\"):\n        _setup_guest(st, 0)\n    intent = _parse_json(intent_json)\n    action = _norm_action(intent.get(\"action\"), query)\n    phase = st.get(\"phase\")\n    if st.get(\"turn\", 0) == 0:\n        action = \"advance\"\n    if phase == \"endgame\" and action != \"reset\":\n        action = \"endgame\"\n    if phase == \"between\" and action not in (\"advance\", \"reset\"):\n        action = \"advance\"\n    g = _guest(st)\n    cur = st[\"current\"]\n    q = str(intent.get(\"query\") or \"\").strip() or (query or \"\")\n    card = _pick_card(intent, query)\n    card_text = g[\"cards\"][{\"A\": 0, \"B\": 1, \"C\": 2}[card]][\"text\"]\n    drink = str(intent.get(\"drink\"\
          ) or \"\").strip() or \"回甘\"\n    st[\"turn\"] = st.get(\"turn\", 0) + 1\n    st[\"current\"][\"beat\"] = g[\"beats\"][min(st.get(\"round\", 0), len(g[\"beats\"]) - 1)]\n    st[\"current\"][\"hint\"] = g[\"hints\"][min(st.get(\"round\", 0), len(g[\"hints\"]) - 1)]\n    npc_scope = st[\"scopes\"].get(cur.get(\"id\", \"\"), \"\")\n    arc_scope = st[\"scopes\"].get(\"archive\", \"\")\n    recall_json = json.dumps({\"scope_id\": npc_scope, \"query\": q, \"mode\": \"hybrid\", \"limit\": 6},\n                             ensure_ascii=False)\n    archive_json = json.dumps({\"scope_id\": arc_scope, \"query\": q, \"mode\": \"hybrid\", \"limit\": 3},\n                              ensure_ascii=False)\n    remember_json = json.dumps({\"scope_id\": npc_scope, \"kind\": \"planted\", \"text\": card_text},\n                               ensure_ascii=False)\n    return {\n        \"state\": _dump(st),\n        \"action\": action,\n        \"query_text\": q,\n        \"card\": card,\n       \
          \ \"card_text\": card_text,\n        \"drink\": drink,\n        \"scope_id\": npc_scope,\n        \"archive_scope_id\": arc_scope,\n        \"recall_json\": recall_json,\n        \"archive_json\": archive_json,\n        \"remember_json\": remember_json,\n    }\n"
